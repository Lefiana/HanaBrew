# HanaBrew local / single-host stack.
#   Host development (fast reloads):   docker compose up -d postgres   then   pnpm dev
#   Whole stack in containers:         docker compose up --build
# Values come from .env (copy .env.example). NOT yet exercised in the authoring sandbox.
name: hanabrew

services:
  postgres:
    # Postgres + the pgvector extension (needed from M4; enabling it later is just a migration).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - hanabrew-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # host-only; remove if you never run the API on the host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: applies committed Prisma migrations, then exits. The API never migrates itself.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      API_PUBLIC_URL: ${API_PUBLIC_URL:?set API_PUBLIC_URL in .env}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?set WEB_PUBLIC_URL in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Hana (AI). Empty values mean "not set".
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OLLAMA_BASE_URL: ${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_ALLOW_CUSTOM_OLLAMA_URL: ${AI_ALLOW_CUSTOM_OLLAMA_URL:-false}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-90000}
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach Ollama running on your machine
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  hanabrew-pgdata:
